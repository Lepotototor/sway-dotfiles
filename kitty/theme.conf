# ~/.config/kitty/rosewood.conf
# Palette identique à colors/rosewood.lua (Neovim) et à la waybar :
# fond rose pâle, texte marron, bleu pin comme accent.

foreground            #4a2f24
background            #fbe0ea

selection_foreground  #4a2f24
selection_background  #f285ae

cursor                #4a2f24
cursor_text_color     #fbe0ea

url_color             #2e5f74

# Bordures des fenêtres/splits
active_border_color   #2e5f74
inactive_border_color #f285ae

# Barre d'onglets
active_tab_background   #2e5f74
active_tab_foreground   #fbe0ea
inactive_tab_background #f285ae
inactive_tab_foreground #4a2f24
tab_bar_background      #fbe0ea

# Couleurs ANSI 0-7 (normales)
color0  #3a2318   /* black       -> marron très foncé */
color1  #b23a48   /* red         -> rouge (erreurs) */
color2  #2f6b4f   /* green       -> vert forêt (nombres/constantes) */
color3  #c9822e   /* yellow      -> orange (pas de vrai jaune dans la palette) */
color4  #2e5f74   /* blue        -> bleu pin (mots-clés) */
color5  #c23f78   /* magenta     -> fonctions */
color6  #3d7a6e   /* cyan        -> teal, entre le vert et le bleu pin */
color7  #f7d0e0   /* white       -> rose pâle plus marqué */

# Couleurs ANSI 8-15 (versions "bright")
color8  #8a6a5b   /* bright black  -> marron clair/grisé (commentaires) */
color9  #d24f5e   /* bright red */
color10 #3f8f68   /* bright green */
color11 #e2a24f   /* bright yellow */
color12 #4a7a90   /* bright blue */
color13 #d9639a   /* bright magenta */
color14 #4f9a8c   /* bright cyan */
color15 #fffaf6   /* bright white -> presque blanc chaud */
